<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINI PLAY</title>
    <link rel="icon" type="image/png" href="/viniplay.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js/dist/mpegts.js"></script>
    <!-- Hls.js for Live DVR Timeshift / Chase Play -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <!-- NEW: Google Cast Framework -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <!-- NEW: Gridstack.js for Multi-View -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack-all.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            overscroll-behavior-y: contain;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: #d1d5db;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .tab-button.active {
            background-color: #3b82f6;
            color: white;
        }

        .bottom-nav-btn.active {
            color: #3b82f6;
        }

        /* Kept for backward compatibility, will be removed by HTML */
        .programme-item {
            border-left: 3px solid #3b82f6;
            transition: all 0.2s;
        }

        .programme-item:hover {
            background-color: #374151;
            cursor: pointer;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        /* Ensure body doesn't scroll, let inner divs handle it */
        .favorite-star {
            transition: all 0.2s;
        }

        .favorite-star.favorited {
            color: #facc15;
            transform: scale(1.2);
        }

        .programme-progress {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background-color: rgba(59, 130, 246, 0.3);
            border-radius: 2px 0 0 2px;
            pointer-events: none;
            transition: width 0.3s linear;
        }

        .programme-item.past {
            background-color: #374151;
            border-left-color: #6b7280;
            opacity: 0.6;
        }

        .programme-item.live {
            border-left: 4px solid #fb923c;
            background-color: #374151;
        }

        .programme-item.live::after {
            content: 'LIVE';
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: #ef4444;
            color: white;
            padding: 1px 4px;
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 4px;
            z-index: 20;
        }

        .programme-item .prog-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .programme-item .prog-time {
            font-size: 0.75rem;
        }

        #group-filter,
        #source-filter,
        #search-input {
            transition: all 0.2s ease;
        }

        #group-filter:hover,
        #source-filter:hover,
        #search-input:hover {
            background-color: #4b5563;
        }

        body.modal-open {
            overflow: hidden;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 28px;
            height: 28px;
            cursor: se-resize;
            z-index: 50;
            touch-action: none;
        }

        .resize-handle::after {
            content: '';
            position: absolute;
            display: block;
            width: 14px;
            height: 14px;
            bottom: 3px;
            right: 3px;
            background-image: linear-gradient(45deg, #9ca3af 25%, transparent 25%, transparent 75%, #9ca3af 75%), linear-gradient(45deg, #9ca3af 25%, transparent 25%, transparent 75%, #9ca3af 75%);
            background-size: 6px 6px;
            background-position: 0 0, 3px 3px;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
        }

        .resize-handle:hover::after {
            opacity: 1;
            transform: scale(1.15);
        }

        #video-modal-container {
            min-width: 400px;
            min-height: 300px;
            position: relative;
            overflow: visible;
        }

        #program-details-container {
            min-width: 320px;
            max-height: 90vh;
            position: relative;
        }

        #details-desc {
            overflow-y: auto;
        }

        .programme-item.highlighted-search {
            outline: 3px solid #facc15;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.5), inset 0 0 0 2px #facc15;
            z-index: 15;
            transition: all 0.3s ease-out;
            transform: scale(1.02);
        }

        .search-results-header {
            padding: 0.5rem 0.75rem;
            background-color: #374151;
            /* gray-700 */
            color: #d1d5db;
            /* gray-300 */
            font-size: 0.75rem;
            /* text-xs */
            font-weight: 700;
            /* font-bold */
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #4b5563;
            /* gray-600 */
        }

        .sources-table th,
        .data-table th {
            @apply px-4 py-2 text-left text-xs font-medium text-gray-400 uppercase tracking-wider;
        }

        .sources-table td,
        .data-table td {
            @apply px-4 py-3 whitespace-nowrap text-sm text-gray-300;
        }

        /* Custom Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4b5563;
            transition: .4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #2563eb;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #2563eb;
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }

        .source-badge {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .source-badge {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .chno-badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #3b82f6;
            color: white;
            flex-shrink: 0;
        }

        /* --- Guide Grid Styles for sticky headers --- */
        #guide-container {
            flex-grow: 1;
            /* Make it fill available space */
            background-color: #111827;
            /* Match body background */
            overflow: auto;
            /* Handles both vertical and horizontal scrolling */
            position: relative;
            /* For the now-line's absolute positioning relative to scrolled content */
        }

        #guide-grid {
            display: grid;
            grid-template-columns: var(--channel-col-width, 180px) 1fr;
            /* Sticky channel info, then scrollable timeline */
            grid-auto-rows: min-content;
            /* Rows size to content, important for first row sticky */
            position: relative;
            /* For now-line absolute positioning */
            min-width: fit-content;
            /* Ensure grid stretches to contain wide timeline */
            height: fit-content;
            /* Allow content to dictate height */
        }

        .sticky-corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 45;
            /* FIX: Increased z-index to be above all other headers */
            background-color: #1a2233;
            /* Match channel-info background */
            height: 64px;
            /* Explicit height, matches time-bar-cell */
            width: var(--channel-col-width, 180px);
            border-bottom: 1px solid #374151;
            border-right: 1px solid #374151;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 8px;
        }

        .channel-resize-handle {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
            z-index: 35;
        }

        .channel-resize-handle::after {
            content: '';
            position: absolute;
            display: block;
            width: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 60%;
            background-color: #9ca3af;
            opacity: 0.6;
            border-radius: 1px;
        }

        .channel-resize-handle:hover::after {
            opacity: 1;
            background-color: #ffffff;
        }

        .time-bar-cell {
            position: sticky;
            top: 0;
            left: 0;
            /* Reset position */
            z-index: 25;
            background-color: #111827;
            height: 64px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #374151;
            box-sizing: border-box;
            overflow: hidden;
            grid-column: 2;
            /* Explicitly place in second column */
        }

        .channel-info {
            position: sticky;
            left: 0;
            z-index: 30;
            background-color: #1a2233;
            border-right: 1px solid #374151;
            box-sizing: border-box;
            height: 96px;
            width: var(--channel-col-width, 180px);
        }

        .timeline-row {
            position: relative;
            height: 96px;
        }

        #now-line {
            position: absolute;
            top: 0;
            background-color: #ef4444;
            width: 2px;
            z-index: 28;
            pointer-events: none;
            transition: left 0.5s ease;
            height: 100%;
        }

        @media (max-width: 767px) {
            /* Removed grid-template-columns override - let it use var(--channel-col-width) from main grid definition */

            .channel-info {
                width: 64px;
            }

            .channel-details {
                display: none;
            }

            .sticky-corner {
                width: 64px;
            }

            .channel-resize-handle {
                display: none;
            }
        }

        #main-header,
        #unified-guide-header {
            transition: transform 0.3s ease-out, opacity 0.3s ease-out, max-height 0.3s ease-out, padding 0.3s ease-out, margin 0.3s ease-out, border-width 0.3s ease-out;
            /* Add padding, margin, border-width to transition */
            transform: translateY(0);
            opacity: 1;
            max-height: 200px;
            /* Set a generous max-height for non-collapsed state */
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: none;
            padding-top: initial;
            /* Ensure padding is managed */
            padding-bottom: initial;
            /* Ensure padding is managed */
            z-index: 35;
        }

        #main-header {
            padding: 1rem;
            z-index: 40;
        }

        #unified-guide-header {
            padding: 0.5rem 1rem;
        }

        #app-container.header-collapsed #main-header,
        #app-container.header-collapsed #unified-guide-header {
            transform: translateY(-100%);
            opacity: 0;
            max-height: 0 !important;
            /* Force max-height to 0 */
            padding: 0 !important;
            /* Force padding to 0 */
            margin: 0 !important;
            /* Force margin to 0 */
            border-width: 0 !important;
            /* Force border to 0 */
            pointer-events: none;
        }

        #page-guide {
            transition: padding-top 0.3s ease-out;
        }

        #page-multiview {
            background-color: #111827;
        }

        .grid-stack {
            background-color: #1f2937;
            background-image:
                linear-gradient(rgba(107, 114, 128, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(107, 114, 128, 0.1) 1px, transparent 1px);
        }

        .grid-stack-item-content {
            display: flex;
            flex-direction: column;
            background-color: #1f2937;
            color: #d1d5db;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: box-shadow 0.2s;
        }

        .grid-stack-item-content.active-player {
            box-shadow: 0 0 0 3px #3b82f6, 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.25rem 0.5rem;
            background-color: #374151;
            cursor: move;
            flex-shrink: 0;
        }

        .player-header-title {
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .player-controls button {
            background: none;
            border: none;
            color: #9ca3af;
            padding: 0.25rem;
            border-radius: 9999px;
            transition: all 0.2s;
        }

        .player-controls button:hover {
            color: white;
            background-color: #4b5563;
        }

        .player-controls .volume-slider {
            width: 60px;
            height: 4px;
            accent-color: #3b82f6;
        }

        .player-body {
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: auto;
            height: auto;
            position: relative;
            background-color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .player-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #6b7280;
            cursor: pointer;
            width: 100%;
            height: auto;
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: auto;
            min-height: 0;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        .player-placeholder:hover {
            background-color: #374151;
        }

        .player-placeholder svg {
            width: 2rem;
            height: 2rem;
            margin-bottom: 0.5rem;
        }

        .channel-selector-list {
            max-height: 400px;
        }

        #guide-date-picker::-webkit-calendar-picker-indicator {
            display: none;
            -webkit-appearance: none;
        }

        #cast-btn svg path {
            transition: all 0.2s ease-in-out;
        }

        #cast-btn.cast-connected {
            color: #3b82f6;
        }

        #cast-btn.cast-connected:hover {
            color: #60a5fa;
        }

        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        #notification-modal-wrapper {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 100;
            pointer-events: none;
        }

        #notification-modal-wrapper.hidden {
            display: none;
        }

        #notification-box {
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            pointer-events: all;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease-out, transform 0.3s ease-out, background-color 0.2s ease-in-out;
            min-width: 250px;
            text-align: center;
            background-color: #ef4444;
        }

        #notification-modal-wrapper:not(.hidden) #notification-box {
            opacity: 1;
            transform: translateY(0);
        }

        #notification-box.success-bg {
            background-color: #22c55e;
        }

        #notification-box.error-bg {
            background-color: #ef4444;
        }

        /* Styles for the direct player page */
        #direct-player-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        #direct-player-console {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.875rem;
            color: #d1d5db;
            height: 120px;
            overflow-y: auto;
        }

        /* NEW: Stream info overlay styles */
        #stream-info-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }

        #stream-info-overlay p {
            margin: 0;
            line-height: 1.4;
        }

        /* MODIFIED: Added styles for icon placeholders */
        [data-icon] {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        [data-icon]>svg {
            width: 1.25rem;
            /* Corresponds to w-5 */
            height: 1.25rem;
            /* Corresponds to h-5 */
        }

        /* Mobile menu icon size */
        #mobile-menu-toggle [data-icon]>svg {
            width: 1.5rem;
            /* w-6 */
            height: 1.5rem;
            /* h-6 */
        }

        /* Player widget icon size */
        .player-controls [data-icon]>svg {
            width: 1rem;
            /* w-4 */
            height: 1rem;
            /* h-4 */
        }

        /* Mobile nav icon size */
        #mobile-nav-menu [data-icon]>svg {
            width: 1.5rem;
            /* w-6 */
            height: 1.5rem;
            /* h-6 */
        }

        /* NEW: Broadcast Banner Styles */
        #broadcast-banner-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            pointer-events: none;
        }

        .broadcast-banner {
            background-color: #fb923c;
            color: #431407;
            padding: 0.75rem;
            text-align: center;
            font-weight: 500;
            opacity: 0;
            transform: translateY(-100%);
            transition: opacity 0.5s, transform 0.5s;
            pointer-events: all;
        }

        .broadcast-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .pagination-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.375rem 0.75rem;
            min-width: 2.25rem;
            height: 2.25rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            font-weight: 500;
            color: #9ca3af;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        .pagination-btn:hover:not(:disabled):not(.active) {
            background-color: #374151;
            color: #ffffff;
            border-color: #4b5563;
        }

        .pagination-btn.active {
            color: #ffffff;
            font-weight: 700;
            background-color: #2563eb;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
            cursor: default;
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination-ellipsis {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2rem;
            height: 2.25rem;
            font-size: 0.875rem;
            color: #6b7280;
            user-select: none;
        }

        .transcode-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        /* --- NEW: Group Filter Modal Styles --- */
        .group-filter-tab-btn.active {
            background-color: #3b82f6;
            color: white;
        }

        .group-filter-tab-btn {
            font-size: 0.875rem;
            /* text-sm */
            font-weight: 500;
            /* font-medium */
            padding: 0.5rem 1rem;
            /* py-2 px-4 */
            color: #d1d5db;
            /* text-gray-300 */
            border-radius: 0.375rem;
            /* rounded-md */
            transition: all 0.2s;
        }

        .group-filter-tab-btn:not(.active):hover {
            background-color: #374151;
            /* hover:bg-gray-700 */
        }

        .group-filter-item {
            background-color: #374151;
            /* bg-gray-700 */
            padding: 0.75rem;
            /* p-3 */
            border-radius: 0.375rem;
            /* rounded-md */
            border: 1px solid #4b5563;
            /* border-gray-600 */
            cursor: pointer;
            transition: all 0.2s;
            align-self: start;
            /* Aligns item to the top of its grid cell */
            min-height: 4.5rem;
            /* Ensures a minimum height for all items */
            display: flex;
            /* Added display flex for vertical centering if needed, though align-self:start might be enough */
            align-items: center;
            /* Vertically center content within the min-height */
            justify-content: center;
            /* Horizontally center content */
            text-align: center;
            /* Center text for wrapping */
        }

        .group-filter-item.selected {
            background-color: #2563eb;
            /* bg-blue-600 */
            border-color: #3b82f6;
            /* border-blue-500 */
            color: white;
        }

        .group-filter-item:not(.selected):hover {
            background-color: #4b5563;
            /* hover:bg-gray-600 */
        }

        .episode-item-epnum {
            color: #93c5fd;
            font-size: 0.75rem;
            font-weight: 600;
            width: 1.75rem;

        #app-container.multiview-immersive #main-header,
        #app-container.multiview-immersive #multiview-header {
            display: none;
        }

        #app-container.multiview-immersive .player-header {
            display: none;
        }

        /* This is for the reappearing header logic */
        #app-container.multiview-immersive #multiview-header.overlay-visible {
            display: flex;
            /* Re-show the header */
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(31, 41, 55, 0.95);
            /* bg-gray-800 with transparency */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 50;
            /* Ensure it's on top of the grid */
        }

        /* --- Video Modal Custom & Fullscreen Styles --- */
        #video-modal-container:fullscreen,
        #video-modal-container:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            max-width: 100vw !important;
            border-radius: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        #video-modal-container:fullscreen #video-resize-handle,
        #video-modal-container:-webkit-full-screen #video-resize-handle {
            display: none !important;
        }

        /* Locked state styling */
        #video-modal.player-locked #video-modal-header {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #video-modal.player-locked #video-resize-handle {
            display: none !important;
        }

        /* Audio wave animation */
        @keyframes audioWavePulse {
            0%, 100% { height: 6px; }
            50% { height: 24px; }
        }

        .audio-wave-bar {
            transform-origin: bottom;
            animation: audioWavePulse 1.2s ease-in-out infinite;
        }

        /* PiP active state styling: invisible on screen, active in DOM */
        #video-modal.pip-active {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Video modal header button optimizations for touch & desktop */
        #video-modal-header button {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        #video-modal-header button svg,
        #video-modal-header button span {
            pointer-events: none;
        }

        /* Hide scrollbars for the header buttons container if overflowing on narrow mobile screens */
        #video-modal-header > div:last-child {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #video-modal-header > div:last-child::-webkit-scrollbar {
            display: none;
        }

        @media (max-width: 767px) {
            .resize-handle {
                width: 36px !important;
                height: 36px !important;

            .resize-handle::after {

                height: 16px !important;

                right: 4px !important;
            }

            }

                font-size: 0.875rem !important;
            }
            #video-modal-header button {
                padding: 0.35rem !important;
            }
        }
    </style>
</head>

                    <!-- 5. Close Modal -->
                    <button id="close-modal"
                        class="text-gray-400 hover:text-white text-xl sm:text-2xl leading-none font-bold p-1 sm:p-1.5 rounded-md hover:bg-gray-700 flex-shrink-0 transition-colors ml-1 cursor-pointer"
                        title="Close">&times;</button>
                </div>
            </div>

            <!-- Audio Track Menu -->
            <div id="audio-track-menu"
                class="absolute bottom-16 right-4 bg-gray-900 rounded-lg shadow-xl border border-gray-700 min-w-[200px] max-h-[300px] overflow-y-auto z-50 hidden">
                <div class="px-4 py-3 border-b border-gray-700 font-semibold text-white">Audio Tracks</div>
                <div id="audio-track-list" class="py-2"></div>
            </div>

            <!-- Subtitle Track Menu -->
            <div id="subtitle-track-menu"
                class="absolute bottom-16 right-4 bg-gray-900 rounded-lg shadow-xl border border-gray-700 min-w-[200px] max-h-[300px] overflow-y-auto z-50 hidden">
                <div class="px-4 py-3 border-b border-gray-700 font-semibold text-white">Subtitles</div>
                <div id="subtitle-track-list" class="py-2"></div>
            </div>
            <div id="video-content" class="flex-grow p-1 bg-black relative overflow-hidden rounded-b-lg">
                <video id="videoElement" controls autoplay playsinline webkit-playsinline class="w-full h-full"></video>
                <!-- Dedicated Audio Element for uninterrupted mobile lock-screen playback -->
                <audio id="audioElement" playsinline class="hidden"></audio>

                <!-- NEW: Audio-Only Overlay -->
                <div id="audio-only-overlay"
                    class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-950/95 backdrop-blur-md text-white p-6 z-30 select-none">
                    <div class="relative mb-6">
                        <img id="audio-only-logo" src="" alt="Channel Logo"
                            class="w-24 h-24 sm:w-32 sm:h-32 object-contain rounded-2xl bg-gray-800/80 p-3 shadow-2xl border border-gray-700">
                        <div class="absolute -bottom-2 -right-2 bg-blue-600 rounded-full p-2 shadow-lg animate-pulse">
                            <span data-icon="headphones" class="w-5 h-5 text-white"></span>
                        </div>
                    </div>
                    <h3 id="audio-only-title" class="text-xl sm:text-2xl font-bold text-center mb-3 text-white max-w-md truncate px-2"></h3>
                    <div class="flex items-center gap-1.5 mb-6 text-blue-400 text-xs sm:text-sm font-medium tracking-wide">
                        <span class="audio-wave-bar w-1 bg-blue-500 rounded-full inline-block"></span>
                        <span class="audio-wave-bar w-1 bg-blue-400 rounded-full inline-block" style="animation-delay: 0.15s;"></span>
                        <span class="audio-wave-bar w-1 bg-blue-500 rounded-full inline-block" style="animation-delay: 0.3s;"></span>
                        <span class="audio-wave-bar w-1 bg-blue-300 rounded-full inline-block" style="animation-delay: 0.45s;"></span>
                        <span class="audio-wave-bar w-1 bg-blue-500 rounded-full inline-block" style="animation-delay: 0.2s;"></span>
                        <span class="ml-2 uppercase text-xs tracking-wider text-gray-400 font-semibold">Audio Only Mode</span>
                    </div>
                    <button id="resume-video-btn"
                        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg hover:shadow-blue-500/30 transition-all active:scale-95 text-sm sm:text-base cursor-pointer">
                        <span data-icon="play" class="w-5 h-5"></span>
                        <span>Resume Video</span>
                    </button>
                </div>

                <!-- NEW: Player Touch-Lock Overlay -->
                <div id="player-lock-overlay"
                    class="hidden absolute inset-0 z-40 flex items-start justify-end p-4 pointer-events-auto bg-black/10">
                    <button id="player-unlock-btn"
                        class="flex items-center gap-2 bg-gray-900/90 hover:bg-gray-800 text-white border border-gray-600/80 px-4 py-2.5 rounded-full shadow-2xl backdrop-blur-md text-sm font-medium transition-transform active:scale-95 cursor-pointer">
                        <span data-icon="unlock" class="w-5 h-5 text-yellow-400"></span>
                        <span>Tap to Unlock</span>
                    </button>
                </div>

                <!-- NEW: Stream Info Overlay -->
                <div id="stream-info-overlay" class="hidden">
                    <p id="stream-info-resolution"></p>
                    <p id="stream-info-bandwidth"></p>
                    <p id="stream-info-fps"></p>
                    <p id="stream-info-dropped"></p>
                    <p id="stream-info-buffer"></p>
                    <p id="stream-info-video"></p>
                    <p id="stream-info-audio"></p>
                </div>

                <!-- NEW: Live DVR Timeshift Controls Overlay with Scrubber & Quick Seek -->

                <!-- NEW: Transcoded VOD Controls Overlay with Scrubber & Quick Seek -->

                <div id="cast-status"
                    class="hidden absolute inset-0 flex-col items-center justify-center bg-black text-white p-4">
                    <span data-icon="cast" class="w-16 h-16 mb-4"></span>
                    <p id="cast-status-text" class="text-lg font-semibold"></p>
                    <p id="cast-status-channel" class="text-sm text-gray-400"></p>
                </div>
            </div>
            <div id="video-resize-handle" class="resize-handle"></div>
        </div>
    </div>

    <div id="program-details-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div id="program-details-container" class="bg-gray-800 rounded-lg shadow-xl p-6 flex flex-col w-full relative"
            style="width: 512px;">
            <div class="absolute top-4 right-4 flex items-center gap-2 z-10">
                <button id="details-favorite-btn"
                    class="p-2 text-gray-500 hover:text-yellow-400 rounded-full hover:bg-gray-700 transition-colors">
                    <span data-icon="star" class="w-6 h-6 favorite-star"></span>
                </button>
                <button id="details-close-btn"
                    class="p-2 text-gray-400 hover:text-white rounded-full hover:bg-gray-700 transition-colors">
                    <span data-icon="close" class="w-6 h-6"></span>
                </button>
            </div>

            <div id="program-details-header" class="pb-3 border-b border-gray-700 mb-3 flex-shrink-0">
                <div class="pr-20">
                    <h2 id="details-channel" class="text-2xl font-bold text-white"></h2>
                    <h3 id="details-title" class="text-xl font-bold text-white"></h3>
                    <p id="details-time" class="text-sm text-gray-400"></p>
                </div>
            </div>
            <p id="details-desc" class="text-base text-gray-300 flex-grow custom-scrollbar mb-4"></p>
            <div id="program-details-footer"
                class="flex justify-start items-center gap-2 pt-3 border-t border-gray-700 flex-shrink-0 flex-wrap">
                <button id="details-play-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">Play
                    Channel</button>

            </div>
            <div id="details-resize-handle" class="resize-handle"></div>
        </div>
    </div>

    <div id="notification-modal-wrapper" class="hidden">
        <div id="notification-box">
            <p id="notification-message"></p>
        </div>
    </div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-md p-6">
            <h3 id="confirm-title" class="text-lg font-bold text-white mb-2"></h3>
            <p id="confirm-message" class="text-gray-400 mb-6"></p>
            <div class="flex justify-end gap-4">
                <button id="confirm-cancel-btn"
                    class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-md">Cancel</button>
                <button id="confirm-ok-btn"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Resume Playback Prompt Modal -->

    <div id="multiview-channel-selector-modal"
        class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-2xl flex flex-col" style="height: 70vh;">
            <div class="p-4 border-b border-gray-700 flex-shrink-0">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-white">Select a Channel</h3>
                    <select id="multiview-channel-filter"
                        class="bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-sm text-white focus:ring-blue-500 focus:border-blue-500">
                        <option value="all">All Groups</option>
                        <option value="favorites">Favorites</option>
                        <option value="recents">Recents</option>
                    </select>
                </div>

                <!-- NEW: Tab Toggle for "From List" vs "Custom URL" -->
                <div class="flex border border-gray-600 rounded-md overflow-hidden mb-4">

                </div>

                <!-- Search Input (visible for "From List" tab) -->
                <input type="search" id="channel-selector-search" placeholder="Search channels..."
                    class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-sm text-white focus:ring-blue-500 focus:border-blue-500">

                <!-- NEW: Custom URL Input (hidden by default) -->

            </div>
            <div id="channel-selector-list" class="flex-grow p-2 overflow-y-auto custom-scrollbar"></div>
            <div class="bg-gray-700/50 px-6 py-4 flex justify-end gap-4 rounded-b-lg flex-shrink-0">
                <button type="button" id="channel-selector-cancel-btn"
                    class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-md">Cancel</button>
            </div>
        </div>
    </div>

    <div id="save-layout-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[70] p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-sm">
            <form id="save-layout-form">
                <div class="p-6">
                    <h3 class="text-lg font-bold text-white mb-4">Save Layout</h3>
                    <p class="text-gray-400 mb-4 text-sm">Enter a name for the current grid layout.</p>
                    <div>
                        <label for="save-layout-name" class="sr-only">Layout Name</label>
                        <input type="text" id="save-layout-name"
                            class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 text-white focus:ring-blue-500 focus:border-blue-500"
                            placeholder="e.g., Sports 2x2" required>
                    </div>
                </div>
                <div class="bg-gray-700/50 px-6 py-4 flex justify-end gap-4 rounded-b-lg">
                    <button type="button" id="save-layout-cancel-btn"
                        class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-md">Cancel</button>
                    <button type="submit"
                        class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-md">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Live Video Modal -->

    <!-- NEW: Dedicated User Group Filter Modal to prevent conflicts -->

    <script type="module" src="/js/main.js?v=25"></script>

</body>

</html>
